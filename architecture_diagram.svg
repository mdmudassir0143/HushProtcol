<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" font-family="Inter, -apple-system, Helvetica, sans-serif">
  <defs>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #0A0A0A; letter-spacing: -0.5px; }
      .subtitle { font-size: 13px; fill: #6B6B6B; }
      .box-label { font-size: 13px; font-weight: 600; fill: #0A0A0A; }
      .box-detail { font-size: 10px; fill: #6B6B6B; font-family: 'Geist Mono', 'SF Mono', monospace; }
      .flow-label { font-size: 9.5px; fill: #6B6B6B; font-family: 'Geist Mono', 'SF Mono', monospace; }
      .flow-label-bold { font-size: 9.5px; fill: #0A0A0A; font-weight: 600; font-family: 'Geist Mono', 'SF Mono', monospace; }
      .section-label { font-size: 11px; font-weight: 600; fill: #6B6B6B; letter-spacing: 1.5px; }
      .zk-badge-text { font-size: 9px; font-weight: 700; fill: #00A676; letter-spacing: 0.5px; }
      .zk-detail { font-size: 9.5px; fill: #00A676; font-family: 'Geist Mono', 'SF Mono', monospace; }
      .zk-panel-label { font-size: 11px; font-weight: 600; fill: #00A676; letter-spacing: 1.5px; }
      .panel-col-label { font-size: 10px; font-weight: 600; fill: #6B6B6B; letter-spacing: 1px; }
      .panel-mono { font-size: 9.5px; fill: #0A0A0A; font-family: 'Geist Mono', 'SF Mono', monospace; }
      .panel-desc { font-size: 9px; fill: #6B6B6B; }
      .arrow { stroke: #6B6B6B; stroke-width: 1.3; fill: none; }
      .arrow-zk { stroke: #00A676; stroke-width: 1.3; fill: none; stroke-dasharray: 5,3; }
      .legend-text { font-size: 10px; fill: #6B6B6B; }
    </style>
    <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6B6B6B"/>
    </marker>
    <marker id="arrow-head-zk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00A676"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1320" fill="#F5F3EE" rx="16"/>

  <!-- ══════════════════════════ HEADER ══════════════════════════ -->
  <text x="50" y="60" class="title">bullet</text>
  <text x="50" y="82" class="subtitle">zk-private payments on Arc · EVM · BN254 Groth16</text>

  <!-- Legend -->
  <line x1="700" y1="58" x2="730" y2="58" class="arrow"/>
  <text x="738" y="61" class="legend-text">data flow</text>
  <line x1="820" y1="58" x2="850" y2="58" class="arrow-zk"/>
  <text x="858" y="61" class="legend-text">zk proof flow</text>
  <rect x="970" y="51" width="24" height="14" rx="7" fill="#FFFFFF" stroke="#00A676" stroke-width="1.5"/>
  <text x="1002" y="61" class="legend-text">zk component</text>

  <line x1="50" y1="102" x2="1150" y2="102" stroke="#E5E0DE" stroke-width="1"/>

  <!-- ══════════════════════════ SECTION LABELS ══════════════════════════ -->
  <text x="140" y="140" class="section-label" text-anchor="middle">PEOPLE</text>
  <text x="420" y="140" class="section-label" text-anchor="middle">FRONTEND · SDK</text>
  <text x="710" y="140" class="section-label" text-anchor="middle">OFF-CHAIN</text>
  <text x="1015" y="140" class="section-label" text-anchor="middle">ON-CHAIN · ARC</text>

  <!-- ══════════════════════════ ROW 1 ══════════════════════════ -->

  <!-- Sender Wallet -->
  <rect x="50" y="160" width="180" height="76" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="140" y="192" class="box-label" text-anchor="middle">Arc Wallet</text>
  <text x="140" y="209" class="box-detail" text-anchor="middle">signs deposit / auth</text>

  <!-- Send Form -->
  <rect x="320" y="160" width="200" height="100" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="420" y="188" class="box-label" text-anchor="middle">Send Form</text>
  <text x="420" y="205" class="box-detail" text-anchor="middle">@username · fixed USDC</text>
  <text x="420" y="220" class="box-detail" text-anchor="middle">SDK createNote</text>
  <text x="420" y="235" class="box-detail" text-anchor="middle">encrypt → POST /notes</text>

  <!-- Backend -->
  <rect x="610" y="160" width="200" height="100" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="710" y="188" class="box-label" text-anchor="middle">Backend</text>
  <text x="710" y="205" class="box-detail" text-anchor="middle">POST /auth/wallet</text>
  <text x="710" y="220" class="box-detail" text-anchor="middle">GET /users/:username</text>
  <text x="710" y="235" class="box-detail" text-anchor="middle">notes inbox · no proving</text>

  <!-- BulletPool -->
  <rect x="900" y="160" width="230" height="130" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="1015" y="188" class="box-label" text-anchor="middle">BulletPool</text>
  <text x="1015" y="205" class="box-detail" text-anchor="middle">deposit(token, amt, C)</text>
  <text x="1015" y="220" class="box-detail" text-anchor="middle">withdraw(proof, root, …)</text>
  <text x="1015" y="235" class="box-detail" text-anchor="middle">nullifiers · token registry</text>
  <text x="1015" y="250" class="box-detail" text-anchor="middle">chainId 5042002</text>

  <!-- ══════════════════════════ ROW 2 ══════════════════════════ -->

  <!-- Encrypted Note / Inbox -->
  <rect x="50" y="420" width="180" height="90" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="140" y="450" class="box-label" text-anchor="middle">Encrypted Note</text>
  <text x="140" y="467" class="box-detail" text-anchor="middle">secret + commitment</text>
  <text x="140" y="482" class="box-detail" text-anchor="middle">inbox or claim link</text>

  <!-- Withdraw UI -->
  <rect x="320" y="420" width="200" height="90" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="420" y="450" class="box-label" text-anchor="middle">Inbox / Withdraw</text>
  <text x="420" y="467" class="box-detail" text-anchor="middle">decrypt note locally</text>
  <text x="420" y="482" class="box-detail" text-anchor="middle">fetch witness · prove</text>

  <!-- Indexer -->
  <rect x="610" y="420" width="200" height="100" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="710" y="450" class="box-label" text-anchor="middle">Indexer</text>
  <text x="710" y="467" class="box-detail" text-anchor="middle">watch Deposit events</text>
  <text x="710" y="482" class="box-detail" text-anchor="middle">postRoot · GET /witness</text>
  <text x="710" y="497" class="box-detail" text-anchor="middle">never stores secrets</text>

  <!-- MerkleRootManager -->
  <rect x="900" y="420" width="230" height="90" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="1015" y="450" class="box-label" text-anchor="middle">MerkleRootManager</text>
  <text x="1015" y="467" class="box-detail" text-anchor="middle">postRoot(root)</text>
  <text x="1015" y="482" class="box-detail" text-anchor="middle">isKnownRoot · ring ×64</text>

  <!-- ══════════════════════════ ROW 3 (ZK ROW) ══════════════════════════ -->

  <!-- Browser Prover / SDK -->
  <rect x="320" y="570" width="200" height="120" rx="16" fill="white" stroke="#00A676" stroke-width="1.5"/>
  <rect x="462" y="582" width="46" height="16" rx="8" fill="#EAF6F0"/>
  <text x="485" y="593" class="zk-badge-text" text-anchor="middle">ZK</text>
  <text x="340" y="612" class="box-label">@bullet/sdk</text>
  <text x="420" y="633" class="zk-detail" text-anchor="middle">snarkjs · WASM</text>
  <text x="420" y="648" class="zk-detail" text-anchor="middle">withdraw.wasm + zkey</text>
  <text x="420" y="663" class="zk-detail" text-anchor="middle">generateProof in-browser</text>

  <!-- Merkle Tree -->
  <rect x="610" y="570" width="200" height="120" rx="16" fill="white" stroke="#00A676" stroke-width="1.5"/>
  <rect x="752" y="582" width="46" height="16" rx="8" fill="#EAF6F0"/>
  <text x="775" y="593" class="zk-badge-text" text-anchor="middle">ZK</text>
  <text x="630" y="612" class="box-label">Poseidon Tree</text>
  <text x="710" y="633" class="zk-detail" text-anchor="middle">depth 20 · off-chain</text>
  <text x="710" y="648" class="zk-detail" text-anchor="middle">Option B · indexer owns</text>
  <text x="710" y="663" class="zk-detail" text-anchor="middle">2^20 leaf capacity</text>

  <!-- Groth16 Verifier -->
  <rect x="900" y="570" width="230" height="120" rx="16" fill="white" stroke="#00A676" stroke-width="1.5"/>
  <rect x="1072" y="582" width="46" height="16" rx="8" fill="#EAF6F0"/>
  <text x="1095" y="593" class="zk-badge-text" text-anchor="middle">ZK</text>
  <text x="920" y="612" class="box-label">WithdrawVerifier</text>
  <text x="1015" y="633" class="zk-detail" text-anchor="middle">Groth16 · BN254</text>
  <text x="1015" y="648" class="zk-detail" text-anchor="middle">IVerifier · pool.setVerifier</text>
  <text x="1015" y="663" class="zk-detail" text-anchor="middle">Solidity pairing check</text>

  <!-- ══════════════════════════ ROW 4 ══════════════════════════ -->

  <!-- Postgres -->
  <rect x="610" y="740" width="200" height="70" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="710" y="770" class="box-label" text-anchor="middle">Postgres</text>
  <text x="710" y="787" class="box-detail" text-anchor="middle">deposits · roots · sync</text>

  <!-- On-Chain Storage -->
  <rect x="900" y="740" width="230" height="90" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="1015" y="770" class="box-label" text-anchor="middle">On-Chain State</text>
  <text x="1015" y="787" class="box-detail" text-anchor="middle">nullifiers (spent)</text>
  <text x="1015" y="802" class="box-detail" text-anchor="middle">known roots (×64)</text>
  <text x="1015" y="817" class="box-detail" text-anchor="middle">allowed ERC-20 tokens</text>

  <!-- ══════════════════════════ ROW 5 ══════════════════════════ -->

  <!-- ERC-20 -->
  <rect x="900" y="870" width="230" height="70" rx="16" fill="white" stroke="#E5E0DE" stroke-width="1"/>
  <text x="1015" y="900" class="box-label" text-anchor="middle">ERC-20 · USDC</text>
  <text x="1015" y="917" class="box-detail" text-anchor="middle">transferFrom / transfer</text>

  <!-- ══════════════════════════ ARROWS ══════════════════════════ -->

  <!-- Sender -> Send Form -->
  <line x1="230" y1="198" x2="317" y2="207" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="255" y="182" width="30" height="14" fill="#F5F3EE"/>
  <text x="270" y="193" class="flow-label" text-anchor="middle">sign</text>

  <!-- Send Form -> Backend resolve -->
  <line x1="520" y1="200" x2="607" y2="200" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="530" y="184" width="50" height="14" fill="#F5F3EE"/>
  <text x="555" y="195" class="flow-label" text-anchor="middle">resolve</text>

  <!-- Send Form -> Contract (deposit) -->
  <path d="M520,230 L545,230 L545,330 L855,330 L855,210 L897,210" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="560" y="314" width="280" height="14" fill="#F5F3EE"/>
  <text x="700" y="325" class="flow-label-bold" text-anchor="middle">deposit(token, amount, commitment)</text>

  <!-- Send Form -> Encrypted Note -->
  <path d="M355,260 L172,417" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="210" y="330" width="90" height="14" fill="#F5F3EE"/>
  <text x="255" y="341" class="flow-label" text-anchor="middle">POST /notes</text>

  <!-- Encrypted Note -> Withdraw UI -->
  <line x1="230" y1="465" x2="317" y2="458" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="255" y="449" width="30" height="14" fill="#F5F3EE"/>
  <text x="270" y="460" class="flow-label" text-anchor="middle">open</text>

  <!-- Withdraw UI -> SDK Prover -->
  <line x1="420" y1="510" x2="420" y2="567" class="arrow-zk" marker-end="url(#arrow-head-zk)"/>
  <rect x="403" y="530" width="34" height="14" fill="#F5F3EE"/>
  <text x="420" y="541" class="zk-detail" text-anchor="middle">prove</text>

  <!-- SDK -> Indexer witness -->
  <path d="M520,630 L570,630 L570,470 L607,470" class="arrow-zk" marker-end="url(#arrow-head-zk)"/>
  <rect x="575" y="545" width="150" height="14" fill="#F5F3EE"/>
  <text x="580" y="556" class="zk-detail">GET /witness/:C</text>

  <!-- Indexer -> Merkle Tree -->
  <line x1="710" y1="520" x2="710" y2="567" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="679" y="536" width="62" height="14" fill="#F5F3EE"/>
  <text x="710" y="547" class="flow-label" text-anchor="middle">insert leaf</text>

  <!-- Merkle Tree -> Postgres -->
  <line x1="710" y1="690" x2="710" y2="737" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="685" y="706" width="50" height="14" fill="#F5F3EE"/>
  <text x="710" y="717" class="flow-label" text-anchor="middle">persist</text>

  <!-- Contract -> Indexer (deposit events) -->
  <path d="M900,230 L875,230 L875,470 L813,470" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="881" y="320" width="90" height="14" fill="#F5F3EE"/>
  <text x="886" y="331" class="flow-label">Deposit events</text>

  <!-- Indexer -> MerkleRootManager (postRoot) -->
  <path d="M810,450 L845,450 L845,465 L897,465" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="830" y="430" width="58" height="14" fill="#F5F3EE"/>
  <text x="835" y="441" class="flow-label">postRoot</text>

  <!-- RootManager used by Pool -->
  <line x1="1015" y1="420" x2="1015" y2="293" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="1025" y="340" width="70" height="14" fill="#F5F3EE"/>
  <text x="1028" y="351" class="flow-label">isKnownRoot</text>

  <!-- SDK -> Contract (withdraw) -->
  <path d="M520,670 L595,670 L595,390 L1000,390 L1000,293" class="arrow-zk" marker-end="url(#arrow-head-zk)"/>
  <rect x="620" y="376" width="340" height="14" fill="#F5F3EE"/>
  <text x="790" y="387" class="zk-detail" text-anchor="middle">withdraw(proof, root, nullifier, digest, recipient, token, amt)</text>

  <!-- Pool -> Verifier -->
  <line x1="1060" y1="290" x2="1060" y2="567" class="arrow-zk" marker-end="url(#arrow-head-zk)"/>
  <rect x="1030" y="420" width="60" height="14" fill="#F5F3EE"/>
  <text x="1060" y="431" class="zk-detail" text-anchor="middle">verify</text>

  <!-- Verifier / Pool -> Storage -->
  <line x1="1015" y1="690" x2="1015" y2="737" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="905" y="706" width="110" height="14" fill="#F5F3EE"/>
  <text x="960" y="717" class="flow-label" text-anchor="middle">record nullifier</text>

  <!-- Storage -> ERC-20 -->
  <line x1="1015" y1="830" x2="1015" y2="867" class="arrow" marker-end="url(#arrow-head)"/>
  <rect x="994" y="841" width="42" height="14" fill="#F5F3EE"/>
  <text x="1015" y="852" class="flow-label" text-anchor="middle">transfer</text>

  <!-- ══════════════════════════ ZK PROOF DETAILS PANEL ══════════════════════════ -->
  <rect x="50" y="980" width="1080" height="300" rx="16" fill="white" stroke="#00A676" stroke-width="1"/>

  <text x="75" y="1012" class="zk-panel-label">ZK PROOF DETAILS</text>
  <text x="75" y="1034" class="box-label">Circuit: withdraw.circom · Groth16 / BN254 · depth-20 Poseidon Merkle</text>
  <line x1="75" y1="1048" x2="1105" y2="1048" stroke="#E5E0DE" stroke-width="1"/>

  <!-- Column 1: Public Inputs -->
  <text x="75" y="1075" class="panel-col-label">PUBLIC INPUTS (LOCKED)</text>
  <text x="75" y="1096" class="panel-mono">root <tspan fill="#6B6B6B">· posted by indexer, pool-known</tspan></text>
  <text x="75" y="1116" class="panel-mono">nullifier <tspan fill="#6B6B6B">· Poseidon([secret])</tspan></text>
  <text x="75" y="1136" class="panel-mono">recipientDigest <tspan fill="#6B6B6B">· identity binding</tspan></text>
  <text x="75" y="1156" class="panel-mono">amount <tspan fill="#6B6B6B">· raw ERC-20 units</tspan></text>
  <text x="75" y="1176" class="panel-mono">tokenHash <tspan fill="#6B6B6B">· uint256(uint160(token))</tspan></text>
  <text x="75" y="1196" class="panel-desc">matches BulletPool.tokenHashOf on-chain</text>

  <line x1="410" y1="1060" x2="410" y2="1255" stroke="#E5E0DE" stroke-width="1"/>

  <!-- Column 2: Private Inputs -->
  <text x="435" y="1075" class="panel-col-label">PRIVATE INPUTS</text>
  <text x="435" y="1096" class="panel-mono">secret</text>
  <text x="435" y="1112" class="panel-desc">random field element, never leaves the browser</text>
  <text x="435" y="1138" class="panel-mono">pathElements[20]</text>
  <text x="435" y="1154" class="panel-desc">Merkle sibling hashes from indexer</text>
  <text x="435" y="1180" class="panel-mono">pathIndices[20]</text>
  <text x="435" y="1196" class="panel-desc">left/right path bits</text>

  <line x1="720" y1="1060" x2="720" y2="1255" stroke="#E5E0DE" stroke-width="1"/>

  <!-- Column 3: Constraints -->
  <text x="745" y="1075" class="panel-col-label">CONSTRAINTS</text>
  <text x="745" y="1096" class="panel-mono">nullifier = Poseidon([secret])</text>
  <text x="745" y="1116" class="panel-mono">commitment = Poseidon([secret,</text>
  <text x="745" y="1132" class="panel-mono">  recipientDigest, amount, tokenHash])</text>
  <text x="745" y="1148" class="panel-desc">binds identity, value, and token to the leaf</text>
  <text x="745" y="1174" class="panel-mono">leaf proven under root via 20</text>
  <text x="745" y="1190" class="panel-mono">Poseidon(left, right) rounds</text>
  <text x="745" y="1206" class="panel-desc">path bits and siblings stay private</text>
  <text x="745" y="1230" class="panel-mono">deposit needs no circuit</text>
  <text x="745" y="1246" class="panel-desc">only withdraw proves membership</text>

</svg>
